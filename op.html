<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Замовлення · Мʼясний Барон</title>
<link rel="icon" href="icon-192.png">
<style>
/* Панель точки. Відкривається на планшеті поруч із касовою програмою,
   тож усе велике: кнопки під палець, шрифт читається з відстані. */
:root{
  --coal:#1b1c1f; --char:#141010; --line:#2b2724; --line-2:#3a3531;
  --bone:#f0e9de; --smoke:#9b938a; --ember:#c4342a; --ember-hot:#e04a3c;
  --ok:#7ba84f; --warn:#d8a13a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--char);color:var(--bone);
  font:16px/1.45 system-ui,-apple-system,'Segoe UI',sans-serif;
  padding-bottom:calc(20px + env(safe-area-inset-bottom))}
button{font:inherit;cursor:pointer;border:none}

/* шапка */
.top{position:sticky;top:0;z-index:10;background:rgba(20,16,16,.97);
  border-bottom:1px solid var(--line);padding:10px 14px calc(10px);
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top b{font-size:19px}
.top .shop{color:var(--smoke);font-size:14px}
.cnt{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill{background:var(--coal);border:1px solid var(--line);border-radius:999px;
  padding:6px 12px;font-size:14px;white-space:nowrap}
.pill.hot{background:rgba(196,52,42,.16);border-color:rgba(224,74,60,.5);color:var(--ember-hot)}
.pill.off{background:rgba(216,161,58,.14);border-color:rgba(216,161,58,.5);color:var(--warn)}

/* список */
/* На касовому моніторі точки половина екрана лишалась порожньою: панель
   робилась під планшет (власник, 27.09). Тепер займаємо всю ширину, але
   не розтягуємось нескінченно — понад 1800 px очі бігали б через екран. */
.wrap{max-width:1800px;margin:0 auto;padding:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}

/* підсумок дня — вузька смужка під шапкою */
.day{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;
  background:var(--coal);border:1px solid var(--line);border-radius:12px;
  padding:10px 14px;margin-bottom:14px;font-size:14px;color:var(--smoke)}
.day b{color:var(--bone);font-size:17px;font-weight:600}
.day .mut{font-size:13px}

/* купки: нові, в роботі, завершені */
.sect{margin-bottom:18px}
.sect h2{display:flex;align-items:center;gap:8px;margin:0 0 9px;
  font-size:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--smoke)}
.sect h2 i{font-style:normal;background:var(--coal);border:1px solid var(--line);
  border-radius:999px;padding:1px 9px;font-size:12px;letter-spacing:0}
.sect.hot h2{color:var(--ember-hot)}
.sect.hot h2 i{border-color:rgba(224,74,60,.45)}
.sect .sub{display:flex;align-items:center;gap:8px;margin:14px 0 9px;
  font-size:13px;font-weight:500;color:var(--warn)}
.sect .sub i{font-style:normal;background:var(--coal);border:1px solid rgba(216,161,58,.4);
  border-radius:999px;padding:1px 9px;font-size:12px}
.sect.done h2{cursor:pointer;user-select:none}
.sect.done .card{opacity:.72}
/* На інші дні — приглушено: сьогодні з ними робити нічого */
.sect.later h2{color:var(--warn)}
.sect.later h2 i{border-color:rgba(216,161,58,.4)}
.sect.later .card{opacity:.82}
.card{background:var(--coal);border:1px solid var(--line);border-radius:14px;padding:14px;
  display:flex;flex-direction:column;gap:10px}
.card.new{border-color:rgba(224,74,60,.6);box-shadow:0 0 0 1px rgba(224,74,60,.25)}
.card.ready{border-color:rgba(123,168,79,.5)}
.card.late{border-color:rgba(216,161,58,.65)}
.hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hd .no{font-size:22px;font-weight:600}
.hd .st{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--line);color:var(--bone)}
.card.new .hd .st{background:var(--ember);color:#fff}
.card.ready .hd .st{background:rgba(123,168,79,.25);color:var(--ok)}
.hd .time{margin-left:auto;font-size:17px;font-weight:600}
.hd .time small{display:block;font-size:12px;font-weight:400;color:var(--smoke);text-align:right}
/* «завтра» чи «26.09» біля часу — щоб замовлення на інший день
   не читалось як сьогоднішнє */
.hd .time em{font-style:normal;color:var(--warn)}
.meta{font-size:14px;color:var(--smoke)}
.meta b{color:var(--bone);font-weight:500}
.lines{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0;
  display:flex;flex-direction:column;gap:4px;font-size:15px}
.ln{display:flex;justify-content:space-between;gap:10px}
.ln span:first-child{min-width:0}
.ln .fry{color:var(--ember-hot)}
.note{background:rgba(216,161,58,.12);border-left:3px solid var(--warn);padding:7px 10px;
  border-radius:0 8px 8px 0;font-size:14px}
.sum{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
.sum b{font-size:21px}
.act{display:flex;gap:8px;flex-wrap:wrap}
.act .go{flex:1;min-height:52px;border-radius:12px;background:var(--ember);color:#fff;
  font-size:17px;font-weight:600;padding:0 14px}
.act .go:active{transform:scale(.98)}
.act .go[disabled]{background:var(--line);color:var(--smoke);font-weight:500;font-size:15px}
.act .tel{min-height:52px;min-width:56px;border-radius:12px;background:var(--coal);
  border:1px solid var(--line-2);color:var(--bone);display:grid;place-items:center;
  text-decoration:none;padding:0 14px;font-size:15px}
/* дрібні дії: сума, коментар, скасування */
.more{display:flex;gap:6px;flex-wrap:wrap}
.more button{flex:1;min-width:64px;min-height:40px;border-radius:10px;background:var(--char);
  border:1px solid var(--line-2);color:var(--bone);font-size:14px}
.more button:active{transform:scale(.97)}
/* Скасування не розтягуємо на всю ширину: воно стоїть поруч із великою
   кнопкою наступного кроку, і промах коштує замовлення. */
.more .danger{flex:0 0 auto;padding:0 16px;color:var(--ember-hot);border-color:rgba(224,74,60,.4)}
.form{background:var(--char);border:1px solid var(--line-2);border-radius:12px;padding:10px;
  display:flex;flex-direction:column;gap:8px}
.form label{font-size:13px;color:var(--smoke)}
.form input{width:100%;min-height:46px;border-radius:10px;background:var(--coal);
  border:1px solid var(--line-2);color:var(--bone);font-size:17px;padding:0 12px}
.form .row{display:flex;gap:8px}
.form .row button{flex:1;min-height:46px;border-radius:10px;font-size:15px}
.form .ok{background:var(--ember);color:#fff;font-weight:600}
.form .no{background:var(--coal);border:1px solid var(--line-2);color:var(--bone)}
.form .hint{font-size:12.5px;color:var(--smoke)}
/* вибір кількості й різновиду — кнопками під палець, а не набором цифр */
.vars{display:flex;flex-wrap:wrap;gap:6px}
.vars button{min-height:40px;padding:0 12px;border-radius:10px;background:var(--coal);
  border:1px solid var(--line-2);color:var(--bone);font-size:14px}
.vars button.on{background:var(--ember);border-color:var(--ember);color:#fff;font-weight:600}
.form .chk{min-height:44px;border-radius:10px;background:var(--coal);
  border:1px solid var(--line-2);color:var(--bone);font-size:15px;text-align:left;padding:0 14px}
.form .chk.on{color:var(--ember-hot);border-color:rgba(224,74,60,.5)}
.form .srow{margin:0}
/* перемикач екранів: замовлення / стоп-лист / мангал */
.tabs{display:flex;gap:6px;width:100%;order:3}
.tabs button{flex:1;min-height:42px;border-radius:10px;background:var(--coal);
  border:1px solid var(--line);color:var(--smoke);font-size:15px}
.tabs button.on{background:var(--ember);border-color:var(--ember);color:#fff;font-weight:600}

/* стоп-лист і мангал */
.screen{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.screen h2{font-size:15px;color:var(--smoke);font-weight:500;margin:6px 0 0}
.search{width:100%;min-height:52px;border-radius:12px;background:var(--coal);
  border:1px solid var(--line-2);color:var(--bone);font-size:17px;padding:0 14px}
.srow{display:flex;align-items:center;gap:10px;background:var(--coal);
  border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.srow span{flex:1;min-width:0;font-size:15px}
.srow button{min-height:42px;min-width:118px;border-radius:10px;background:var(--char);
  border:1px solid var(--line-2);color:var(--bone);font-size:14px;padding:0 12px}
.srow .danger{color:var(--ember-hot);border-color:rgba(224,74,60,.4)}
.srow .back{color:var(--ok);border-color:rgba(123,168,79,.45)}
.srow .gone{font-style:normal;font-size:12px;color:var(--ember-hot);
  border:1px solid rgba(224,74,60,.4);border-radius:999px;padding:1px 8px;margin-left:6px}
.hint2{color:var(--smoke);font-size:14px;padding:4px 2px}
.state{background:var(--coal);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px}
.state.shut{border-color:rgba(224,74,60,.5);color:var(--ember-hot)}
.gslot{background:var(--coal);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  display:flex;flex-direction:column;gap:8px}
.gtop{display:flex;align-items:baseline;gap:10px;font-size:15px}
.gtop b{font-size:17px}
.gtop em{font-style:normal;font-size:12px;color:var(--warn);
  border:1px solid rgba(216,161,58,.45);border-radius:999px;padding:1px 8px}
.gslot.now{opacity:.85}
.gtop span{margin-left:auto;color:var(--smoke);font-size:14px}
.gtop .full{color:var(--ember-hot)}
.bar{height:8px;border-radius:999px;background:var(--char);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.hot{background:var(--ember)}
.gslot button{min-height:40px;border-radius:10px;background:var(--char);
  border:1px solid var(--line-2);color:var(--bone);font-size:14px}
.gacts{display:flex;gap:8px;flex-wrap:wrap}
.gacts button{flex:1;min-width:150px;min-height:48px;border-radius:12px;background:var(--coal);
  border:1px solid var(--line-2);color:var(--bone);font-size:15px}
.gacts .free{color:var(--ok);border-color:rgba(123,168,79,.45)}
.gacts .shut{color:var(--ember-hot);border-color:rgba(224,74,60,.4)}
.empty{color:var(--smoke);text-align:center;padding:60px 20px;font-size:17px}
.enter{max-width:460px;margin:60px auto;padding:22px;background:var(--coal);
  border:1px solid var(--line);border-radius:14px;text-align:center}
.enter h1{font-size:20px;margin:0 0 10px}
.enter p{color:var(--smoke);margin:8px 0}
.enter code{background:var(--char);padding:2px 7px;border-radius:6px;color:var(--bone)}
.err{background:rgba(196,52,42,.15);border:1px solid rgba(224,74,60,.5);color:var(--bone);
  border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:14px}
</style>
</head>
<body>
<div class="top">
  <div>
    <b>Замовлення</b>
    <div class="shop" id="shop">—</div>
  </div>
  <div class="cnt">
    <span class="pill off" id="mute" hidden>🔇 торкніться екрана, щоб увімкнути звук</span>
    <span class="pill" id="net">звʼязок…</span>
    <span class="pill hot" id="cNew" hidden>нових: 0</span>
    <span class="pill" id="cWork">у роботі: 0</span>
  </div>
  <nav class="tabs" id="tabs">
    <button data-view="orders" class="on">Замовлення</button>
    <button data-view="stock">🚫 Стоп-лист</button>
    <button data-view="grill">🔥 Мангал</button>
  </nav>
</div>

<div class="wrap" id="wrap">
  <p class="empty">Завантажую…</p>
</div>

<!-- Прайс для стоп-листа беремо звідти ж, звідки його бере сайт і сервер:
     другої копії назв і номерів позицій у панелі немає. -->
<script src="catalog.js?v=b2000c4c"></script>
<script>
/* ---------- доступ ----------
   Код приходить у чат точки командою /panel і живе в адресі після
   решітки: так він не потрапляє ні в логи сервера, ні в історію
   переходів. Обміняли на ключ — і прибрали з адреси. */
const API='https://api.meat-baron.kh.ua';
const KEY='mb-op-token';
let token=null, shopName='';
try{ token=localStorage.getItem(KEY) }catch(e){}

const $=id=>document.getElementById(id);
const val=id=>{ const e=$(id); return e?e.value:null };
const put=(id,v)=>{ const e=$(id); if(e&&v!=null) e.value=v };
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const money=n=>(Math.round(n*100)/100).toFixed(2).replace(/\.00$/,'')+' ₴';
const hhmm=ms=>new Date(ms).toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'});
const wLabel=g=>g>=1000?(g/1000).toFixed(g%100?2:g%1000?1:0)+' кг':g+' г';

async function claim(code){
  const r=await fetch(API+'/api/op/claim',{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok||!d.token) throw new Error(d.error||'Не вдалося увійти');
  token=d.token; shopName=d.shopName||'';
  try{ localStorage.setItem(KEY,token) }catch(e){}
  history.replaceState(null,'',location.pathname);
}

function askEnter(msg){
  $('wrap').innerHTML=`<div class="enter">
    ${msg?`<p class="err">${esc(msg)}</p>`:''}
    <h1>Панель точки</h1>
    <p>Щоб відкрити цей планшет, напишіть у чаті точки <code>/panel</code> —
    бот дасть посилання. Відкрийте його тут один раз, далі просто заходьте на цю сторінку.</p>
  </div>`;
  $('net').textContent='немає доступу';
  $('tabs').hidden=true;                 // без ключа перемикати нічого
}

/* ---------- малюємо ---------- */
const NEXT={new:['accepted','✅ Прийняти в роботу'],accepted:['cooking','👨‍🍳 Готується'],
  cooking:['ready','🔥 Готове'],ready:null,onway:['done','🤝 Доставлено']};
const nextOf=o=> o.status==='ready'
  ? (o.mode==='delivery'?['onway','🚗 Передали курʼєру']:['done','🤝 Видано'])
  : NEXT[o.status]||null;

/* Поки відкрита форма — опитування сервера стоїть: перемальовка стерла б
   набране оператором просто під пальцями. */
let seenNew=new Set(), lastOk=0, form=null;
/* Три екрани в одній вкладці: замовлення, стоп-лист, мангал. Лічильники
   в шапці живуть завжди — оператор має бачити нове замовлення, навіть
   поки прибирає позицію зі стоп-листа. */
let view='orders', SHOP=null, stockQ='', DATA=null;
/* Зроблені за день ховаємо: вони цікаві раз на зміну, а місце на екрані
   займають постійно. Розгортаються натисканням на заголовок. */
let showDone=false, formSig='';

/* Замовлення на інший день лежить прийнятим до самого дня видачі — так і
   задумано, готувати наперед не можна. Але в «У роботі» воно заважало:
   висіло серед сьогоднішніх по два дні, і оператор щоразу відсіював його
   очима (власник, 28.09 — замовлення на середу). Тепер їм окрема купка.
   Нові туди не потрапляють: їх треба прийняти одразу, хай там яка дата. */
const groupOf=o=> o.status==='new' ? 0
                : (o.status==='done'||o.status==='canceled') ? 3
                : o.day ? 2
                : 1;

/* Підсумок дня: скільки вже прийняли, на яку суму, скільки мʼяса на
   мангал. Рахує сервер — той самий підсумок, що йде в чат після
   закриття, тож цифри в панелі й у боті не розходяться. */
function dayStrip(d){
  if(!d||!d.all) return '<div class="day"><span>Сьогодні замовлень із сайту ще не було</span></div>';
  return `<div class="day">
    <span><b>${d.all-d.canceled}</b> замовлень</span>
    <span><b>${money(d.sum)}</b></span>
    <span>на мангал <b>${wLabel(d.fg)}</b></span>
    <span class="mut">самовивіз ${d.pickup} · доставка ${d.delivery}</span>
    ${d.canceled?`<span class="mut">скасовано ${d.canceled}</span>`:''}
    ${d.later?`<span class="mut">чекають свого дня ${d.later}</span>`:''}
  </div>`;
}

/* Усередині кожної купки доставка йде окремо: по ній інша робота —
   подзвонити курʼєру, проставити вартість, — і серед самовивозу вона
   губилась (власник, 27.09). Порядок роботи при цьому не ламається:
   нове лишається в новому, готове в готовому. */
const grid=(l,now)=>`<div class="grid">${l.map(o=>card(o,now)).join('')}</div>`;
const sect=(title,cls,list,now)=>{
  if(!list.length) return '';
  const own=list.filter(o=>o.mode!=='delivery');
  const dlv=list.filter(o=>o.mode==='delivery');
  return `<section class="sect ${cls}"><h2>${title}<i>${list.length}</i></h2>
    ${own.length?grid(own,now):''}
    ${dlv.length?`<h3 class="sub">🚕 Доставка<i>${dlv.length}</i></h3>${grid(dlv,now)}`:''}
  </section>`;
};

const doneSect=(list,now)=> list.length
  ? `<section class="sect done"><h2 data-done="1" role="button" tabindex="0">
       ${showDone?'▾':'▸'} Завершені сьогодні<i>${list.length}</i></h2>
     ${showDone?grid(list,now):''}</section>`
  : '';

function draw(d){
  DATA=d;
  shopName=d.shopName||shopName;
  $('shop').textContent=shopName;
  const now=d.now||Date.now();
  const live=d.orders.filter(o=>o.status!=='done'&&o.status!=='canceled');
  const fresh=live.filter(o=>o.status==='new').length;
  $('cWork').textContent='у роботі: '+live.length;
  $('cNew').hidden=!fresh;
  $('cNew').textContent='нових: '+fresh;
  document.title=(fresh?`(${fresh}) `:'')+'Замовлення · Мʼясний Барон';
  /* Сигналимо на кожне замовлення, якого ще не бачили, а не на зростання
     лічильника: якщо за ті самі десять секунд оператор прийняв одне й
     прийшло інше, лічильник не змінився б — і нове проїхало б мовчки. */
  const freshNos=live.filter(o=>o.status==='new').map(o=>o.no);
  if(freshNos.some(no=>!seenNew.has(no))) beep();
  seenNew=new Set(freshNos);

  if(view!=='orders') return;        // лічильники оновили, а екран зараз інший
  const w=$('wrap');
  /* Три купки замість однієї стрічки: нові, ті, що в роботі, і зроблені.
     В одній стрічці все лежало вперемішку, і в суботу при 90 замовленнях
     живі губились би серед виданих (власник, 27.09). */
  /* Перемальовка стирає поля форми: опитування ми на цей час спиняємо,
     але сама панель перемальовується й від своїх кнопок — наприклад коли
     розгортають «Завершені». Оператор набирав суму, зазирнув у зроблені —
     і набране зникло. Тож знімаємо значення до перемальовки й повертаємо
     після неї. */
  /* Але лише в межах того самого кроку. Форма додавання позиції має
     два кроки — пошук і кількість, — і без цієї перевірки набране в
     пошуку («сулуг») підставлялось у поле ваги, а позиція не додавалась
     узагалі. */
  const sig=form?form.kind+'|'+(form.pick||''):'';
  const typed=(form&&sig===formSig)?{v:val('fv'),n:val('fn')}:null;
  formSig=sig;
  const g=[[],[],[],[]];
  d.orders.forEach(o=>g[groupOf(o)].push(o));
  w.innerHTML=dayStrip(d.day)
    +(d.orders.length?'':'<p class="empty">Замовлень зараз немає.</p>')
    +sect('Нові — прийняти в роботу','hot',g[0],now)
    +sect('У роботі','',g[1],now)
    +sect('Чекають свого дня','later',g[2],now)
    +doneSect(g[3],now);
  if(typed){ put('fv',typed.v); put('fn',typed.n) }
  const dh=w.querySelector('[data-done]');
  if(dh) dh.onclick=()=>{ showDone=!showDone; draw(d) };
  w.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>step(b.dataset.go,b.dataset.st,b));
  w.querySelectorAll('[data-form]').forEach(b=>b.onclick=()=>{
    form={no:+b.dataset.form,kind:b.dataset.kind}; draw(d); focusForm();
  });
  w.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{ form=null; draw(d) });
  w.querySelectorAll('[data-send]').forEach(b=>b.onclick=()=>send(b));
  /* ---- склад замовлення ---- */
  w.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{
    const it=priceList().find(i=>i.id===b.dataset.pick);
    form.pick=b.dataset.pick;
    form.q=it&&it.unit!=='вага'?1:(it?it.minG:0);
    form.fry=false; form.v='';
    draw(d);
  });
  w.querySelectorAll('[data-var]').forEach(b=>b.onclick=()=>{ form.v=b.dataset.var; draw(d) });
  /* Обрали кнопкою — чистимо поле «своєї» кількості, інакше воно
     перебиватиме вибір при відправці. */
  w.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{ form.q=+b.dataset.q; put('fv',''); draw(d) });
  w.querySelectorAll('[data-fry]').forEach(b=>b.onclick=()=>{ form.fry=!form.fry; draw(d) });
  w.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{ form.pick=''; form.search=''; draw(d) });
  w.querySelectorAll('[data-addline]').forEach(b=>b.onclick=()=>addLine(b));
  w.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delLine(b));
  /* Пошук позиції: перемальовуємо список на кожну літеру, але поле
     створене тим самим draw — значення повертаємо самі, як і у формах. */
  const sq=form&&form.kind==='plus'&&!form.pick?$('fv'):null;
  if(sq) sq.oninput=()=>{ form.search=sq.value; draw(d); focusEnd() };
  w.querySelectorAll('.form input').forEach(i=>i.onkeydown=e=>{
    if(e.key!=='Enter') return;
    e.preventDefault();
    const b=w.querySelector('[data-send]'); if(b&&!b.disabled) b.click();
  });
}

/* Те саме, але без виділення: у пошуку позиції список перемальовується
   на кожну літеру, поле створюється заново, і select() виділяв усе
   набране — наступна літера стирала попередню, і більш як одну ввести
   було неможливо (власник, 28.09). Тут курсор просто в кінець. */
function focusEnd(){
  const el=$('fv');
  if(!el) return;
  el.focus();
  const n=el.value.length;
  try{ el.setSelectionRange(n,n) }catch(e){}
}

/* autofocus не спрацьовує на щойно вставленій розмітці — фокусуємо руками */
function focusForm(){
  const el=$('fv');
  if(el){ el.focus(); try{ el.select() }catch(e){} el.scrollIntoView({block:'nearest'}) }
}

function card(o,now){
  const nx=nextOf(o);
  /* «Прийняти в роботу» дозволено завжди — і на завтра, і задовго до
     часу: сервер пропускає саме цей крок повз обидві заборони. Панель
     гасила кнопку на будь-якому кроці, і замовлення на завтра неможливо
     було взяти, хоча в боті та сама кнопка працювала (власник, 27.09).
     Заборона стосується лише готування й видачі. */
  const later=nx&&nx[0]!=='accepted';
  const soon=later&&(!!o.day||(o.startAt&&now<o.startAt));
  /* На інший день час без дати збиває з пантелику: «можна з 09:00»
     виглядає як «сьогодні о девʼятій». */
  const soonText=o.day?`готувати ${esc(o.day)}`:`можна з ${hhmm(o.startAt)}`;
  const late=o.slotAt&&now>o.slotAt&&o.status!=='done'&&o.status!=='canceled';
  const cls=o.status==='new'?'new':o.status==='ready'?'ready':late?'late':'';
  const when=o.slotAt? hhmm(o.slotAt) : 'якнайшвидше';
  return `<article class="card ${cls}">
    <div class="hd">
      <span class="no">№ ${o.no}</span>
      <span class="st">${esc(o.label)}</span>
      <span class="time">${o.day?`<em>${esc(o.day)}</em> `:''}${esc(when)}<small>${o.mode==='delivery'?'доставка':'самовивіз'}</small></span>
    </div>
    <div class="meta">
      <b>${esc(o.nm)}</b> · ${esc(o.tel)}
      ${o.mode==='delivery'&&o.addr?`<br>${esc(o.addr)}`:''}
      ${o.fry?`<br>🔥 на мангал ${wLabel(o.fg)}`:''}
      ${o.pay==='card'?'<br>💳 картка на місці':''}
    </div>
    <div class="lines">${o.lines.map(l=>`<div class="ln">
      <span>${esc(l.name)}${l.v?` «${esc(l.v)}»`:''} · ${l.unit==='вага'?wLabel(l.qty):l.qty+' шт'}${l.fry?' <span class="fry">🔥</span>':''}</span>
      <span>${money(l.sum)}</span></div>`).join('')}</div>
    ${o.note?`<div class="note">💬 ${esc(o.note)}</div>`:''}
    <div class="sum"><span>${o.totalOrig&&o.totalOrig!==o.total?'уточнено':'до сплати'}</span><b>${money(o.total)}</b></div>
    <div class="act">
      ${nx?`<button class="go" data-go="${o.no}" data-st="${nx[0]}" ${soon?'disabled':''}>${soon?soonText:nx[1]}</button>`
           :`<button class="go" disabled>${esc(o.label)}</button>`}
      <a class="tel" href="tel:${esc(o.tel)}">📞</a>
    </div>
    ${form&&form.no===o.no? formHtml(o,form.kind) : more(o)}
  </article>`;
}

/* Дрібні дії під карткою. Показуємо лише те, що сервер зараз дозволить:
   суму міняють до «Готується», доставку — майже до видачі. */
function more(o){
  const can=o.can||{}, b=[];
  /* ➕ і ➖ тепер про склад замовлення, а не про гроші: клієнт
     передзвонює й просить додати сулугуні чи прибрати ребра — це буває
     щодня, а підкрутити суму наосліп сенсу мало (власник, 28.09).
     Правка суми лишилась однією кнопкою — «🧾 Сума» з каси. */
  if(can.money){
    b.push(['fact','🧾 Сума'],['plus','➕ Позиція'],['minus','➖ Позиція'],['note','💬']);
  }
  if(can.ship&&o.mode==='delivery') b.push(['ship','🚕 Доставка']);
  if(can.cancel) b.push(['cancel','✖️ Скасувати',1]);
  if(!b.length) return '';
  return `<div class="more">${b.map(([k,t,danger])=>
    `<button data-form="${o.no}" data-kind="${k}"${danger?' class="danger"':''}>${t}</button>`).join('')}</div>`;
}

const FORM={
  fact:{t:'Фактична сума з каси',n:1,hint:'Разом зі смаженням. Клієнт побачить нову суму.'},
  add:{t:'На скільки збільшити',n:1,hint:'Наприклад: додали соус.'},
  sub:{t:'На скільки зменшити',n:1,hint:'Наприклад: вага вийшла менша.'},
  ship:{t:'Вартість доставки',n:1,hint:'Нова замінить попередню.'},
  note:{t:'Коментар для клієнта',n:0,hint:'Сума не зміниться.'},
  cancel:{t:'Причина скасування',n:0,hint:'Її побачить клієнт.',danger:1}
};
/* ---------- склад замовлення ----------
   Прайс той самий, що й у стоп-листі, — з catalog.js. Ціну тут не
   рахуємо й не надсилаємо: сервер порахує сам із номера позиції,
   кількості й позначки «на мангал». */
function lineForms(o,kind){
  if(kind==='minus') return delForm(o);
  return form.pick? pickForm(o) : searchForm();
}

function delForm(o){
  const rows=(o.lines||[]).map((l,i)=>`<div class="srow">
      <span>${esc(l.name)}${l.v?` «${esc(l.v)}»`:''} · ${l.unit==='вага'?wLabel(l.qty):l.qty+' шт'}${l.fry?' 🔥':''}</span>
      <button data-del="${i}" class="danger">✕ Прибрати</button>
    </div>`).join('');
  return `<div class="form">
    <label>Що прибрати із замовлення</label>
    ${rows}
    ${/* Причина не обовʼязкова, але клієнту вона пояснює, чому сума
         впала: «закінчилось» і «ви передумали» — різні речі. */''}
    <input type="text" id="fn" placeholder="Причина, якщо треба: закінчилось, клієнт передумав">
    <div class="hint">Причину побачить клієнт разом зі зміною суми.</div>
    ${(o.lines||[]).length<2?'<div class="hint">Це остання позиція. Якщо замовлення не потрібне — скасуйте його.</div>':''}
    <div class="row"><button class="no" data-close="1">Назад</button></div>
  </div>`;
}

function searchForm(){
  const q=fold(form.search||'').trim();
  const hits=q.length>=2
    ? priceList().filter(i=>fold(i.grp+' '+i.name).includes(q)).slice(0,12)
    : [];
  return `<div class="form">
    <label>Що додати</label>
    <input type="text" id="fv" autocomplete="off" placeholder="Назва: ошийок, сулугуні, лаваш…" autofocus>
    ${q.length<2?'<div class="hint">Наберіть хоча б дві літери.</div>'
      : hits.length?hits.map(i=>{
          /* Позначаємо те, що оператор сам зранку відправив у стоп-лист:
             інакше легко пообіцяти клієнтові те, чого сьогодні немає.
             Додати все одно можна — може, привезли чи знайшли. */
          const off=SHOP&&(SHOP.stop||[]).includes(i.id);
          return `<div class="srow">
            <span>${esc(i.grp)} · ${esc(itemName(i))}${off?' <em class="gone">сьогодні немає</em>':''}</span>
            <button data-pick="${esc(i.id)}">Обрати</button></div>`;
        }).join('')
      : '<div class="hint">Нічого схожого не знайшли.</div>'}
    <div class="row"><button class="no" data-close="1">Назад</button></div>
  </div>`;
}

function pickForm(){
  const it=priceList().find(i=>i.id===form.pick);
  if(!it) return searchForm();
  const vs=typeof variantsOf==='function'&&variantsOf(it);
  const piece=it.unit!=='вага';
  /* Швидкі кнопки — ті самі кроки, що й на сайті: оператор не набирає
     цифри вручну, коли клієнт каже «півкіло». */
  const quick=piece?[1,2,3,4]:[it.minG,500,1000,1500,2000].filter((v,i,a)=>v>=it.minG&&a.indexOf(v)===i);
  return `<div class="form">
    <label>${esc(it.grp)} · ${esc(itemName(it))}</label>
    ${vs?`<div class="vars">${vs.list.map(([v])=>
      `<button data-var="${esc(v)}" class="${form.v===v?'on':''}">${esc(v)}</button>`).join('')}</div>`:''}
    <div class="vars">${quick.map(v=>
      `<button data-q="${v}" class="${Number(form.q)===v?'on':''}">${piece?v+' шт':wLabel(v)}</button>`).join('')}</div>
    ${/* Поле лишається порожнім навмисне: воно тільки для «свого» числа.
         Коли в ньому стояла обрана кнопкою кількість, набране перебивало
         наступний вибір — тиснеш «500 г», а йде 350. */''}
    <input type="text" inputmode="numeric" id="fv" placeholder="${piece?'або скільки штук':'або скільки грамів'}">
    ${typeof canFry==='function'&&canFry(it)
      ? `<button class="chk${form.fry?' on':''}" data-fry="1">${form.fry?'✓':''} На мангал</button>` : ''}
    <div class="hint">${piece?'Мінімум 1 шт.':`Мінімум ${wLabel(it.minG)}.`}${vs&&!form.v?' Оберіть різновид.':''}</div>
    <div class="row">
      <button class="ok" data-addline="1">Додати в замовлення</button>
      <button class="no" data-back="1">Інша позиція</button>
    </div>
  </div>`;
}

function formHtml(o,kind){
  if(kind==='plus'||kind==='minus') return lineForms(o,kind);
  const f=FORM[kind];
  return `<div class="form">
    <label>${f.t}</label>
    ${/* не type="number": на планшеті десяткова клавіша дає кому, а
          числове поле з комою просто порожніє — оператор набирає «612,40»
          і бачить нуль. Беремо текст і розбираємо самі. */''}
    ${f.n?`<input type="text" inputmode="decimal" id="fv" placeholder="0,00" autofocus>
           <input type="text" id="fn" placeholder="Коментар, якщо треба">`
         :`<input type="text" id="fv" placeholder="${kind==='cancel'?'немає в наявності':'Текст для клієнта'}" autofocus>`}
    <div class="hint">${f.hint}</div>
    <div class="row">
      <button class="ok" data-send="${o.no}" data-kind="${kind}">${kind==='cancel'?'Скасувати замовлення':'Зберегти'}</button>
      <button class="no" data-close="1">Назад</button>
    </div>
  </div>`;
}

/* ---------- стоп-лист ----------
   Назви й номери позицій беремо з catalog.js — того самого файлу, що
   тримає прайс сайту й сервера. Через це «Люля кебаб» у панелі
   підписаний так само, як у боті: курячий і з баранини. */
const fold=s=>String(s||'').toLowerCase().replace(/[ʼ'’`]/g,'');
const priceList=()=>(typeof ITEMS==='undefined'?[]:ITEMS);
const itemName=it=>(typeof nameOf==='function'?nameOf(it):it.name);

function drawStock(){
  /* Поле пошуку створюємо один раз: якби воно перемальовувалось разом
     зі списком, набране зникало б на кожному оновленні. */
  if(!$('stockBox')){
    $('wrap').innerHTML=`<div class="screen">
      <input class="search" id="sq" type="text" autocomplete="off" autocorrect="off"
             placeholder="Знайти позицію: ошийок, крильця…">
      <div id="stockBox"><p class="empty">Завантажую…</p></div>
    </div>`;
    $('sq').value=stockQ;
    $('sq').oninput=()=>{ stockQ=$('sq').value; paintStock() };
  }
  paintStock();
}

function paintStock(){
  const box=$('stockBox');
  if(!box) return;
  if(!SHOP) return;
  const off=new Set(SHOP.stop||[]);
  const q=fold(stockQ).trim();
  const gone=priceList().filter(i=>off.has(i.id));
  const hits=q.length>=2 ? priceList().filter(i=>fold(i.grp+' '+i.name).includes(q)) : [];
  /* Те, що вже знято, лишається лише у верхньому списку — інакше та сама
     позиція стояла б на екрані двічі й оператор не знав би, яку тиснути. */
  const found=hits.filter(i=>!off.has(i.id)).slice(0,30);
  const row=(it,isOff)=>`<div class="srow">
      <span>${esc(it.grp)} · ${esc(itemName(it))}</span>
      <button data-stock="${esc(it.id)}" data-off="${isOff?0:1}" class="${isOff?'back':'danger'}">
        ${isOff?'✅ Є':'🚫 Немає'}</button>
    </div>`;
  box.innerHTML=
    (gone.length
      ? `<h2>Сьогодні немає — на сайті не показуємо${SHOP.openHour?` (повернуться о ${SHOP.openHour}:00)`:''}</h2>`
        +gone.map(i=>row(i,true)).join('')
      : '<p class="hint2">Зараз усе в наявності.</p>')
   +(q.length>=2
      ? (found.length ? '<h2>Знайдено в прайсі</h2>'+found.map(i=>row(i,false)).join('')
       : hits.length  ? '<p class="hint2">Усе знайдене вже в списку вище.</p>'
       : '<p class="hint2">Нічого схожого не знайшли. Спробуйте коротше: «ошийок».</p>')
      : '<p class="hint2">Наберіть хоча б дві літери, щоб знайти позицію.</p>');
  box.querySelectorAll('[data-stock]').forEach(b=>b.onclick=()=>stockAct(b));
}

async function stockAct(btn){
  btn.disabled=true; const was=btn.textContent; btn.textContent='…';
  const r=await post('/api/op/stock',{id:btn.dataset.stock,off:btn.dataset.off==='1'});
  if(!r){ btn.disabled=false; btn.textContent=was; return }
  paintStock();
}

/* ---------- мангал ----------
   Те саме, що /mangal у боті: скільки на кожну годину вже записано,
   можна закрити найближчі години або, навпаки, додати кілограмів. */
function drawGrill(){
  if(!SHOP) return $('wrap').innerHTML='<p class="empty">Завантажую…</p>';
  const g=SHOP.grill, now=SHOP.now||Date.now();
  const shut=g.busyUntil>now;
  const slots=g.slots.map((ms,i)=>{
    const cap=g.cap+(g.extra[ms]||0), used=g.load[ms]||0;
    const pct=cap?Math.min(100,Math.round(used/cap*100)):100;
    const full=used>=cap;
    /* Поточна година — довідково: сайт на неї вже не продає, надбавка
       нічого не змінить, тож і кнопки немає. */
    const isNow=ms===g.nowSlot;
    return `<div class="gslot${isNow?' now':''}">
      <div class="gtop"><b>${esc(g.labels[i])}</b>${isNow?'<em>зараз</em>':''}
        <span class="${full?'full':''}">${wLabel(used)} з ${wLabel(cap)}${full?' · забито':''}${
          g.extra[ms]?` · +${wLabel(g.extra[ms])} від вас`:''}</span></div>
      <div class="bar"><i class="${full?'hot':''}" style="width:${pct}%"></i></div>
      ${isNow?'':`<button data-grill="add" data-slot="${ms}">+${wLabel(g.step)} на ${esc(g.labels[i])}</button>`}
    </div>`;
  }).join('')
  || '<p class="hint2">До закриття годин уже не лишилось — мангал на сьогодні все.</p>';
  $('wrap').innerHTML=`<div class="screen">
    <div class="state ${shut?'shut':''}">${shut
      ? `Для сайту мангал закритий до <b>${hhmm(g.busyUntil)}</b>.`
      : 'Мангал приймає замовлення з сайту.'}
      <div class="hint2">Сайту віддано ${wLabel(g.cap)} на годину — решту тримаємо на тих,
      хто прийшов чи подзвонив.</div></div>
    ${slots}
    <div class="gacts">
      <button class="shut" data-grill="60">🔥 Зайнятий на годину</button>
      <button class="shut" data-grill="120">🔥 На дві</button>
      <button class="shut" data-grill="day">🔥 До кінця дня</button>
      <button class="free" data-grill="free">✅ Вільний, приймаємо</button>
      <button data-grill="noadd">♻️ Прибрати надбавки</button>
    </div>
  </div>`;
  $('wrap').querySelectorAll('[data-grill]').forEach(b=>b.onclick=()=>grillAct(b));
}

async function grillAct(btn){
  btn.disabled=true; const was=btn.textContent; btn.textContent='…';
  const r=await post('/api/op/grill',{act:btn.dataset.grill,slot:Number(btn.dataset.slot)||0});
  if(!r){ btn.disabled=false; btn.textContent=was; return }
  /* Поки йшов запит, оператор міг перемкнутись на замовлення — тоді
     малювати мангал уже нікуди. */
  if(view==='grill') drawGrill();
}

/* Один шлях для обох екранів: відправили, показали помилку, якщо є,
   і поклали свіжий стан точки, який сервер віддає у відповіді. */
async function post(path,body){
  try{
    const r=await fetch(API+path,{method:'POST',
      headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},
      body:JSON.stringify(body)});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){ alert(d.error||'Не вдалося'); return null }
    SHOP=Object.assign({},SHOP,d);
    return d;
  }catch(e){ alert('Немає звʼязку'); return null }
}

async function loadShop(){
  try{
    const r=await fetch(API+'/api/op/shop',{headers:{Authorization:'Bearer '+token}});
    if(r.status===401) return;                 // те саме скаже опитування замовлень
    const d=await r.json();
    if(d.ok) SHOP=d;
  }catch(e){}
}

function setView(v){
  view=v; form=null;
  $('tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  $('wrap').innerHTML='<p class="empty">Завантажую…</p>';
  if(v==='orders'){ if(DATA) draw(DATA); load(); return }
  loadShop().then(()=>{ if(view===v) v==='stock'?drawStock():drawGrill() });
}

/* Короткий сигнал: планшет стоїть поруч із касою, і панель часто в фоні.
   Браузер не дає вмикати звук до першого дотику до сторінки, а панель
   може простояти відкритою й недоторканою півдня — тоді нове замовлення
   приїхало б мовчки. Тож заводимо звук на першому ж дотику, а поки він
   не працює, чесно пишемо про це в шапці. */
let ac=null;
function audioOn(){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    /* resume() відповідає не одразу — перемальовуємо позначку, коли дозволить */
    if(ac.state==='suspended') ac.resume().then(paintMute,()=>{});
  }catch(e){}
  paintMute();
}
function paintMute(){
  const bad=!ac||ac.state!=='running';
  $('mute').hidden=!bad;
}
function beep(){
  audioOn();
  if(!ac||ac.state!=='running') return;
  try{
    const o=ac.createOscillator(), g=ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.value=880; g.gain.value=.08;
    o.start(); o.stop(ac.currentTime+.18);
  }catch(e){}
}

async function step(no,st,btn){
  btn.disabled=true;
  const was=btn.textContent; btn.textContent='…';
  try{
    const r=await fetch(API+'/api/op/order/'+no+'/status',{method:'POST',
      headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},
      body:JSON.stringify({status:st})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){ alert(d.error||'Не вдалося'); }
    await load();
  }catch(e){ btn.disabled=false; btn.textContent=was; alert('Немає звʼязку') }
}

/* Сума, доставка, коментар, скасування — усі правила на сервері
   (applyAdjust), панель лише передає, що набрав оператор. */
async function send(btn){
  const kind=btn.dataset.kind, no=btn.dataset.send, f=FORM[kind];
  let amount=0, note='';
  if(f.n){
    /* «612,40», «612.40», «612 40»(з пробілом), «612,40 ₴» — усе те саме */
    amount=Number(String($('fv').value).replace(/[\s ₴]/g,'').replace(',','.'));
    if(!isFinite(amount)||!(amount>0)) return alert('Вкажіть суму більше нуля — цифрами');
    note=String($('fn').value||'').trim();
  }else{
    note=String($('fv').value||'').trim();
    if(kind==='cancel'&&!note) return alert('Напишіть причину — її побачить клієнт');
    if(kind==='note'&&!note) return alert('Порожній коментар не надішлемо');
  }
  if(kind==='cancel'&&!confirm('Скасувати замовлення № '+no+'? Клієнту піде сповіщення.')) return;
  btn.disabled=true; const was=btn.textContent; btn.textContent='…';
  try{
    const r=await fetch(API+'/api/op/order/'+no+'/adjust',{method:'POST',
      headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},
      body:JSON.stringify({kind,amount,note})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){ btn.disabled=false; btn.textContent=was; return alert(d.error||'Не вдалося') }
    form=null; await load();
  }catch(e){ btn.disabled=false; btn.textContent=was; alert('Немає звʼязку') }
}

/* Ціну не рахуємо й не надсилаємо — сервер порахує сам. Від нас лише
   номер позиції, кількість, різновид і чи на мангал. */
async function addLine(btn){
  const it=priceList().find(i=>i.id===form.pick);
  if(!it) return;
  const typed=val('fv');
  const q=Math.floor(Number(String(typed==null||typed===''?form.q:typed).replace(/\D/g,''))||0);
  const piece=it.unit!=='вага';
  if(!(q>=(piece?1:it.minG))) return alert(piece?'Вкажіть кількість, мінімум 1 шт':`Вкажіть вагу, мінімум ${wLabel(it.minG)}`);
  const vs=typeof variantsOf==='function'&&variantsOf(it);
  if(vs&&!form.v) return alert('Оберіть різновид');
  btn.disabled=true; const was=btn.textContent; btn.textContent='…';
  const r=await post('/api/op/order/'+form.no+'/line',
    {act:'add',id:it.id,g:q,v:form.v||'',fry:!!form.fry});
  if(!r){ btn.disabled=false; btn.textContent=was; return }
  form=null; await load();
}

async function delLine(btn){
  if(!confirm('Прибрати цю позицію із замовлення?')) return;
  btn.disabled=true; const was=btn.textContent; btn.textContent='…';
  const r=await post('/api/op/order/'+form.no+'/line',
    {act:'del',i:+btn.dataset.del,note:val('fn')||''});
  if(!r){ btn.disabled=false; btn.textContent=was; return }
  form=null; await load();
}

async function load(){
  if(!token) return askEnter();
  /* Оператор щось набирає — не чіпаємо екран. Кажемо про це вголос:
     інакше здасться, що панель зависла й нові замовлення не йдуть. */
  if(form){ $('net').textContent='пауза — відкрита форма'; $('net').classList.add('off'); return }
  try{
    const r=await fetch(API+'/api/op/orders',{headers:{Authorization:'Bearer '+token}});
    if(r.status===401){ token=null; try{localStorage.removeItem(KEY)}catch(e){}; return askEnter('Доступ відкликано.') }
    const d=await r.json();
    if(!d.ok) throw new Error(d.error||'');
    lastOk=Date.now();
    $('net').textContent='оновлено '+hhmm(lastOk);
    $('net').classList.remove('off');
    draw(d);
    /* Стоп-лист і мангал міняють і з бота — тримаємо екран свіжим */
    if(view!=='orders'){
      await loadShop();
      if(view==='stock') paintStock(); else if(view==='grill') drawGrill();
    }
  }catch(e){
    $('net').textContent=lastOk? 'звʼязку немає · останнє '+hhmm(lastOk) : 'звʼязку немає';
    $('net').classList.add('off');
  }
}

(async function(){
  const code=location.hash.replace(/^#/,'').trim();
  if(code&&!token){
    try{ await claim(code) }catch(e){ return askEnter(e.message) }
  }
  if(!token) return askEnter();
  $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>setView(b.dataset.view));
  document.addEventListener('pointerdown',audioOn);   // будь-який дотик заводить звук
  audioOn();                                          // а раптом браузер і так дозволяє
  await load();
  /* Стан точки потрібен уже на екрані замовлень — щоб у пошуку позицій
     було видно, чого сьогодні немає. Раніше він приїжджав лише при
     переході на вкладку стоп-листа. */
  loadShop();
  setInterval(load,10000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) load() });
  /* Esc закриває форму й повертає оновлення — на планшеті є клавіатура */
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&form){ form=null; load() }
  });
})();
</script>
