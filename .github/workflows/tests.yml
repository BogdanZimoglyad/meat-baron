# Тести на кожен PR і кожне вливання в main. Результат — ✅/❌ біля PR
# на GitHub. Нічого не викочує: сайт і далі викочують Pages і Railway.
name: Тести

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit і перевірка сервера (vitest, з покриттям)
        run: npm run cover
