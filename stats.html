<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#141010">
<title>Статистика · Мʼясний Барон</title>
<link rel="icon" href="icon-192.png">
<style>
:root{
  --char:#141010; --coal:#1b1c1f; --line:#2b2724; --line-2:#3a3531;
  --bone:#f0e9de; --smoke:#9b938a; --ember:#c4342a; --ember-hot:#e04a3c;
  --ok:#7ba84f; --bad:#e04a3c;
  /* колір даних: один відтінок на всі графіки — у кожного одна величина */
  --bar:#d9583f; --bar-dim:rgba(217,88,63,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--char);color:var(--bone);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:20px;margin:0}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.top .sub{color:var(--smoke);font-size:13px;width:100%}
.per{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.per button{min-height:40px;padding:0 14px;border-radius:999px;background:var(--coal);border:1px solid var(--line-2);
  color:var(--bone);font-size:14px}
.per button.on{background:var(--ember);border-color:var(--ember);color:#fff;font-weight:600}
/* день: ‹ Ср, 30.09 › */
.dayhd{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.dayhd b{flex:1;text-align:center;font-size:18px}
.dayhd button{min-width:52px;min-height:44px;border-radius:12px;background:var(--coal);border:1px solid var(--line-2);color:var(--bone);font-size:20px}
.dayhd button:disabled{opacity:.3}
/* календар вибору днів */
.pick{background:var(--coal);border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 14px}
.pick .ph{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pick .ph b{flex:1;text-align:center}
.pick .ph button{min-width:44px;min-height:40px;border-radius:10px;background:var(--char);border:1px solid var(--line-2);color:var(--bone);font-size:18px}
.pick .g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.pick .wd{text-align:center;color:var(--smoke);font-size:12px}
.pick .d{min-height:42px;border-radius:9px;background:var(--char);border:1px solid var(--line);color:var(--bone);font-size:15px}
.pick .d:disabled{opacity:.25}
.pick .d.in{background:rgba(196,52,42,.3);border-color:rgba(224,74,60,.5)}
.pick .d.end{background:var(--ember);border-color:var(--ember);color:#fff;font-weight:700}
.pick .d.today{box-shadow:inset 0 0 0 1px var(--smoke)}
.pick .hint{color:var(--smoke);font-size:12.5px;margin-top:8px}
.ol{font-size:14px;padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline}
.ol b{font-variant-numeric:tabular-nums}
.ol .m{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--smoke)}
.ol .r{text-align:right;white-space:nowrap}
.ol.off{opacity:.5}
.chart rect.hit[data-day]{cursor:pointer}
/* вкладки й перемикач «за днем замовлення / видачі» */
.views{display:flex;gap:6px;margin:0 0 10px}
.views button{flex:1;min-height:46px;border-radius:12px;background:var(--coal);border:1px solid var(--line-2);color:var(--smoke);font-size:15px}
.views button.on{background:var(--bone);color:var(--char);border-color:var(--bone);font-weight:600}
.by{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 12px;color:var(--smoke);font-size:13px}
.by button{min-height:34px;padding:0 12px;border-radius:999px;background:var(--coal);border:1px solid var(--line-2);color:var(--bone);font-size:13px}
.by button.on{border-color:var(--ember-hot);color:var(--ember-hot);font-weight:600}
/* список замовлень */
.osearch input{width:100%;min-height:48px;border-radius:12px;background:var(--coal);border:1px solid var(--line-2);color:var(--bone);font-size:16px;padding:0 14px}
.dayg{margin-top:14px}
.dgh{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px 6px;color:var(--smoke);font-size:13px}
.dgh b{color:var(--bone);font-size:15px}
.orow{background:var(--coal);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;cursor:pointer}
.orow.open{border-color:var(--line-2)}
.orow.off{opacity:.6}
.oh{display:flex;align-items:baseline;gap:8px}
.oh .t{color:var(--smoke);font-size:13px}
.oh .r{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.tb{font-size:11px;font-weight:700;letter-spacing:.05em;color:#fff;background:#7a5cc4;border-radius:6px;padding:1px 6px}
.os{color:var(--smoke);font-size:13px;margin-top:2px}
.od{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;cursor:default;font-size:14px}
.dg{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.dg span{color:var(--smoke)} .dg b{font-weight:500;text-align:right}
.dg a{color:var(--bone)}
.cm{background:rgba(216,161,58,.12);border:1px solid rgba(216,161,58,.35);border-radius:8px;padding:8px 10px;margin:8px 0}
.dh{color:var(--smoke);font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin:10px 0 4px}
.dl{display:flex;justify-content:space-between;gap:10px;padding:2px 0;font-variant-numeric:tabular-nums}
.dl.tot{border-top:1px solid var(--line);margin-top:4px;padding-top:6px;font-weight:600}
.dl small{color:var(--smoke);font-weight:400}
.ad{padding:4px 0;border-bottom:1px solid var(--line)} .ad small{display:block;color:var(--smoke);font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(min-width:720px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{background:var(--coal);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile .k{color:var(--smoke);font-size:12.5px}
.tile .v{font-size:24px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .d{font-size:12.5px;margin-top:2px;color:var(--smoke)}
.tile .d .up{color:var(--ok)} .tile .d .down{color:var(--bad)}
.card{background:var(--coal);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.card h2{font-size:15px;margin:0 0 2px;font-weight:600}
.card .note{color:var(--smoke);font-size:12.5px;margin:0 0 10px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--smoke);font-size:10px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart rect.b{fill:var(--bar)}
.chart rect.b.dim{fill:var(--bar-dim)}
.chart rect.hit{fill:transparent;cursor:pointer}
.funnel .row{display:grid;grid-template-columns:96px minmax(0,1fr) 124px;align-items:center;gap:10px;margin:7px 0}
.funnel .lbl{font-size:14px}
.funnel .trk{height:22px;background:var(--char);border-radius:4px;overflow:hidden}
.funnel .fill{height:100%;background:var(--bar);border-radius:0 4px 4px 0}
.funnel .num{font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
.funnel .num small{display:block;color:var(--smoke);font-size:11.5px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--smoke);font-weight:500;font-size:12px;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td:first-child{max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:46%}
.split{display:flex;height:22px;border-radius:4px;overflow:hidden;gap:2px;margin:6px 0 4px}
.split i{display:block;background:var(--bar)}
.split i+i{background:var(--bar-dim)}
.split-l{display:flex;justify-content:space-between;font-size:13px;color:var(--smoke)}
.two{display:grid;gap:12px}
@media(min-width:720px){.two{grid-template-columns:1fr 1fr}.two .card{margin-top:0}}
.cx{font-size:14px;padding:7px 0;border-bottom:1px solid var(--line)}
.cx b{font-weight:600}.cx span{color:var(--smoke);font-size:12.5px}
.empty{color:var(--smoke);text-align:center;padding:50px 16px}
.err{background:rgba(196,52,42,.15);border:1px solid rgba(224,74,60,.5);border-radius:12px;padding:14px;margin:30px 0}
.err code{background:var(--char);padding:2px 7px;border-radius:6px}
#tip{position:fixed;pointer-events:none;z-index:9;background:#0b0909;border:1px solid var(--line-2);border-radius:8px;
  padding:6px 9px;font-size:13px;color:var(--bone);white-space:nowrap;opacity:0;transition:opacity .1s}
#tip b{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>📈 Статистика</h1><span class="sub" id="sub">Мʼясний Барон · замовлення з сайту</span></div>
  <div class="views" id="views"><button data-v="stats" class="on">📈 Статистика</button><button data-v="orders">🧾 Замовлення</button></div>
  <div class="per" id="per">
    <button data-p="yday">Вчора</button><button data-p="today">Сьогодні</button><button data-p="tmrw" hidden>Завтра</button>
    <button data-d="7">7 днів</button><button data-d="30" class="on">30 днів</button>
    <button data-d="90">90 днів</button><button data-d="365">Рік</button>
    <button data-p="pick">📅 Обрати</button>
  </div>
  <div class="by" id="by">Рахувати за: <button data-by="created">днем замовлення</button><button data-by="slot">днем видачі</button></div>
  <div id="pick"></div>
  <div id="dayhd"></div>
  <div id="out"><p class="empty">Завантажую…</p></div>
</div>
<div id="tip"></div>
<script>
/* Статистика для власника (30.09). Вхід як у панель точки: бот у
   особистих дає разове посилання /stats, сторінка міняє код на ключ і
   памʼятає його. Цифри рахує сервер тим самим statsRange, що й /week. */
const API='https://api.meat-baron.kh.ua';
const KEY='mb-stats-token';
/* SEL — що дивимось: {days:N} — останні N днів, або {from,to} — обране.
   Один день — from===to. */
/* BY — за яким днем рахуємо: коли замовили чи коли видавати (тоді видно
   й наперед); VIEW — статистика чи список замовлень */
let token=null, DAYS=30, SEL={days:30}, PICK=null, BY='created', VIEW='stats';
try{ BY=localStorage.getItem('mb-stats-by')==='slot'?'slot':'created'; VIEW=localStorage.getItem('mb-stats-view')==='orders'?'orders':'stats' }catch(e){}
try{ token=localStorage.getItem(KEY); DAYS=+localStorage.getItem('mb-stats-days')||30; SEL={days:DAYS} }catch(e){}
/* Дати — рядками «2026-09-30»; рахуємо в UTC, щоб годинник телефона не зсунув день */
const dAdd=(d,n)=>{const [y,m,dd]=d.split('-').map(Number);return new Date(Date.UTC(y,m-1,dd+n)).toISOString().slice(0,10)};
const MON=['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const money=n=>Math.round(n).toLocaleString('uk-UA').replace(/ /g,' ')+' ₴';
const money2=n=>(Math.round(n*100)/100).toLocaleString('uk-UA',{minimumFractionDigits:0,maximumFractionDigits:2}).replace(/ /g,' ')+' ₴';
const kg=g=>g>=1000?(Math.round(g/100)/10).toLocaleString('uk-UA')+' кг':Math.round(g)+' г';
const pct=(a,b)=>b?Math.round(a/b*100)+'%':'—';
const WD=['Нд','Пн','Вт','Ср','Чт','Пт','Сб'];
const dm=d=>{const [,m,dd]=d.split('-');return +dd+'.'+m};
const wdOf=d=>{const [y,m,dd]=d.split('-').map(Number);return new Date(Date.UTC(y,m-1,dd)).getUTCDay()};

/* «▲ 12%» до попереднього такого ж періоду — без порівняння цифра
   нічого не каже. Зростання зелене, падіння червоне, і стрілка —
   щоб не лише кольором. */
function delta(a,b,lowerIsBetter){
  if(!b) return '<span>попередній період — без даних</span>';
  const d=Math.round((a-b)/b*100);
  if(!d) return '<span>як у попередньому періоді</span>';
  const good=lowerIsBetter? d<0 : d>0;
  return `<span class="${good?'up':'down'}">${d>0?'▲':'▼'} ${Math.abs(d)}%</span> до попереднього`;
}

/* Стовпчики з підказкою на дотик. vals — [{x:підпис, v:число, t:текст підказки}] */
/* Ширина — справжня ширина картки в пікселях: графік не розтягується,
   і підписи лишаються читабельними. half — картка в пів екрана. */
function cw(half){
  const W=$('out').clientWidth||320;
  return Math.max(240,(half&&window.innerWidth>=720?(W-12)/2:W)-30);
}
function bars(vals,{h=150,labelEvery=1,fmt=v=>v,dim=()=>false,half=false}={}){
  const n=vals.length, W=cw(half), padB=18, padT=14;
  const gap=W/n>=6?2:0;
  const max=Math.max(1,...vals.map(x=>x.v));
  const bw=W/n;
  const y=v=>padT+(h-padT-padB)*(1-v/max);
  let g=`<line class="grid" x1="0" x2="${W}" y1="${h-padB}" y2="${h-padB}"/>`;
  /* верхня межа — довідково, одна лінія й число, без густої сітки */
  g+=`<line class="grid" x1="0" x2="${W}" y1="${padT}" y2="${padT}" stroke-dasharray="3 4"/><text x="0" y="${padT-4}">${esc(fmt(max))}</text>`;
  vals.forEach((x,i)=>{
    const bx=i*bw+gap/2, w=Math.max(1,bw-gap), top=y(x.v), hh=h-padB-top;
    if(x.v>0){
      const r=Math.min(4,w/2,hh);
      /* заокруглений лише верх — низ стоїть на осі */
      g+=`<path fill="${dim(x)?'var(--bar-dim)':'var(--bar)'}" d="M${bx},${h-padB} V${top+r} Q${bx},${top} ${bx+r},${top} H${bx+w-r} Q${bx+w},${top} ${bx+w},${top+r} V${h-padB} Z"/>`;
    }
    if(i%labelEvery===0) g+=`<text x="${bx+w/2}" y="${h-4}" text-anchor="middle">${esc(x.x)}</text>`;
    g+=`<rect class="hit" x="${i*bw}" y="0" width="${bw}" height="${h}" data-tip="${esc(x.t)}"${x.day?` data-day="${x.day}"`:''}/>`;
  });
  return `<svg class="chart" width="${W}" height="${h}" viewBox="0 0 ${W} ${h}">${g}</svg>`;
}

function tile(k,v,d){ return `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${d||''}</div></div>` }

let LAST=null;
/* Повернули телефон — перемальовуємо під нову ширину */
let rz=0; window.addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(LAST) render(LAST) },200) });
function render(s){
  LAST=s;
  const c=s.cur, p=s.prev;
  /* підписів днів — стільки, скільки влазить: приблизно на кожні 34 px */
  const every=Math.max(1,Math.ceil(s.perDay.length/Math.floor(cw()/34)));
  const daysBars=key=>s.perDay.map(x=>({x:dm(x.day), v:x[key]||0,
    t:`${WD[wdOf(x.day)]}, ${dm(x.day)} · `+(key==='sum'?money2(x.sum):`${x.n} зам.`)+(x.canceled?` · скасовано ${x.canceled}`:'')+' · торкніться — відкрити день', day:x.day}));
  const weekend=x=>{const w=wdOf(x.day);return w===0||w===6};
  /* замовляють і вночі — там усі 24 години; забирають лише в години точки */
  const hours=(obj,h0=7,h1=21)=>{ const out=[]; for(let h=h0;h<=h1;h++) out.push({x:h, v:obj[h]||0, t:`${String(h).padStart(2,'0')}:00–${String(h+1).padStart(2,'0')}:00 · ${obj[h]||0} зам.`}); return out };
  const wk=[1,2,3,4,5,6,0].map(i=>({x:WD[i], v:s.weekday[i]||0, t:`${WD[i]} · ${s.weekday[i]||0} зам.`}));
  const f=s.funnel, fmax=Math.max(1,f.visit,f.cart,f.checkout,f.orders);
  const frow=(l,n,prev,sub)=>`<div class="row"><span class="lbl">${l}</span>
    <div class="trk"><div class="fill" style="width:${Math.max(n?2:0,n/fmax*100)}%"></div></div>
    <span class="num">${n}<small>${sub||''}</small></span></div>`;
  const pp=s.people;
  const mode=c.pickup+c.delivery, pay=s.pay.cash+s.pay.card;
  const split=(a,b,la,lb)=>(a+b)?`<div class="split"><i style="flex:${a}"></i><i style="flex:${b}"></i></div>
    <div class="split-l"><span>${la} · ${a} (${pct(a,a+b)})</span><span>${lb} · ${b} (${pct(b,a+b)})</span></div>`:'<p class="note">Немає даних</p>';

  const one=s.from===s.to;
  $('sub').textContent=`Мʼясний Барон · замовлення з сайту · ${one?dm(s.from):dm(s.from)+' — '+dm(s.to)}`;
  paintDayHd(s); paintPick();
  if(VIEW==='orders') return renderOrdersView(s);
  if(!c.n&&!c.canceled&&!f.visit){ $('out').innerHTML=`<p class="empty">${one?'Цього дня замовлень із сайту не було.':'За цей період замовлень із сайту ще не було.'}</p>`; return }

  $('out').innerHTML=`
  <div class="tiles">
    ${tile('Замовлень',c.n,delta(c.n,p.n))}
    ${tile('Виручка',money(c.sum),delta(c.sum,p.sum))}
    ${tile('Середній чек',money(c.avg),delta(c.avg,p.avg))}
    ${tile('На мангал',kg(c.fg),delta(c.fg,p.fg))}
    ${tile('Клієнтів',pp.total,`нових ${pp.fresh} · повернулись ${pp.again}`)}
    ${tile('Скасовано',c.canceled,c.n+c.canceled?`${pct(c.canceled,c.n+c.canceled)} замовлень`:'')}
  </div>

  ${s.by==='slot'?'':`<div class="card funnel">
    <h2>Від заходу до замовлення</h2>
    <p class="note">Скільки візитів дійшли до кожного кроку.${s.hitsSince?` Лічильник працює з ${dm(s.hitsSince)} — раніші дні тут порожні.`:' Лічильник щойно увімкнено — цифри зʼявляться з першими відвідувачами.'}</p>
    ${frow('Зайшли',f.visit,0,'')}
    ${frow('Кошик',f.cart,f.visit,f.visit?pct(f.cart,f.visit)+' від заходів':'')}
    ${frow('Оформлення',f.checkout,f.cart,f.cart?pct(f.checkout,f.cart)+' від кошика':'')}
    ${frow('Замовили',f.orders,f.checkout,f.checkout?pct(f.orders,f.checkout)+' від оформлення':'')}
  </div>`}

  ${one?'':`<div class="card"><h2>Виручка по днях</h2><p class="note">Вихідні блідіші. Торкніться стовпчика — відкриється цей день.</p>
    ${bars(daysBars('sum'),{labelEvery:every,fmt:money,dim:weekend})}</div>
  <div class="card"><h2>Замовлень по днях</h2>
    ${bars(daysBars('n'),{labelEvery:every,h:120,dim:weekend})}</div>`}
  ${one?`<p class="note" style="margin:12px 2px 0">Усі замовлення цього дня — на вкладці «🧾 Замовлення».</p>`:''}

  <div class="two">
    <div class="card"><h2>Коли замовляють</h2><p class="note">Година, коли натиснули «Підтвердити» на сайті</p>
      ${bars(hours(s.ordered,0,23),{h:120,half:true,labelEvery:3})}</div>
    <div class="card"><h2>Коли забирають</h2><p class="note">Година видачі — навантаження на точку й мангал</p>
      ${bars(hours(s.pickupHours||{}),{h:120,half:true})}</div>
  </div>
  ${one?'':`<div class="card"><h2>Дні тижня</h2><p class="note">Замовлень на день видачі</p>${bars(wk,{h:110})}</div>`}

  <div class="card"><h2>Що беруть</h2><p class="note">За виручкою. «Замовлень» — у скількох замовленнях була позиція.</p>
    ${s.top.length?`<table><tr><th>Позиція</th><th>Замовлень</th><th>Кількість</th><th>Сума</th></tr>
    ${s.top.map(x=>`<tr><td title="${esc(x.name)}">${esc(x.name)}</td><td>${x.orders}</td><td>${x.unit==='вага'?kg(x.qty):x.qty+' шт'}</td><td>${money(x.sum)}</td></tr>`).join('')}</table>`
    :'<p class="note">Немає даних</p>'}</div>

  <div class="two">
    <div class="card"><h2>Самовивіз і доставка</h2>${split(c.pickup,c.delivery,'Самовивіз','Доставка')}</div>
    <div class="card"><h2>Оплата</h2>${split(s.pay.cash,s.pay.card,'Готівка','Картка')}</div>
  </div>
  ${(()=>{ const t=s.tg||{}; const all=(t.orders||0)+(t.guest||0);
    return `<div class="card"><h2>Вхід через Telegram</h2>
    <p class="note">Хто входив, отримує статуси в Telegram і не вводить дані щоразу.</p>
    <div class="tiles" style="margin-bottom:10px">
      ${tile('Входів',t.logins||0,t.loginsSince?`з них уперше ${t.loginsFresh||0}`:'рахуємо з 30.09')}
      ${tile('Нових акаунтів',t.accounts||0,'уперше увійшли за період')}
    </div>
    ${all?`<div class="split"><i style="flex:${t.orders}"></i><i style="flex:${t.guest}"></i></div>
    <div class="split-l"><span>З входом · ${t.orders} (${pct(t.orders,all)})</span><span>Без входу · ${t.guest} (${pct(t.guest,all)})</span></div>
    <p class="note" style="margin-top:8px">Середній чек: з входом <b style="color:var(--bone)">${t.orders?money(t.sum/t.orders):'—'}</b> · без входу <b style="color:var(--bone)">${t.guest?money(t.guestSum/t.guest):'—'}</b>.
    ${t.approx?' Замовлення до 30.09 пораховано наближено: «з входом» — якщо людина на той час уже входила.':''}</p>`
    :'<p class="note">Замовлень за період немає.</p>'}</div>` })()}
  <div class="card"><h2>Клієнти</h2>
    <p class="note">Новий — перше замовлення з сайту припало на цей період.</p>
    ${split(pp.fresh,pp.again,'Нові','Повернулись')}
    <p class="note" style="margin-top:8px">Замовили більше одного разу за період: <b style="color:var(--bone)">${pp.repeat}</b></p></div>

  <div class="card"><h2>Скасування</h2>
    ${s.cancels.length?s.cancels.map(x=>`<div class="cx"><b>№ ${x.no}</b> <span>${new Date(x.at).toLocaleString('uk-UA',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})}${x.by?' · '+esc(x.by):''}</span><br>${esc(x.why||'без причини')}</div>`).join('')
      :'<p class="note">Скасувань не було 👍</p>'}</div>`;
}

/* ---------- вкладка «Замовлення» ----------
   Усі замовлення обраного дня чи періоду, по днях. Торкнулись рядка —
   розгортається все про замовлення. Власник так переглядає кожне й
   позначає тестові коментарем («тест») — їх видно одразу (30.09). */
const OPEN=new Set();
let OQ='';
const isTest=o=>/тест|test/i.test([o.note,...(o.adj||[]).map(a=>a.note)].join(' '));
const dt=ms=>ms?new Date(ms).toLocaleString('uk-UA',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Kyiv'}):'—';
const ADJ={note:'💬',add:'➕',sub:'➖',fact:'🧾',ship:'🚕',cancel:'✖️'};
function orderDetail(o){
  const line=l=>`<div class="dl"><span>${esc(l.name)} · ${l.unit==='вага'?kg(l.qty):l.qty+' шт'}${l.fry?' 🔥':''}</span><span>${money2(l.sum)}</span></div>`;
  return `<div class="od">
    <div class="dg"><span>Оформили</span><b>${dt(o.at)}</b></div>
    <div class="dg"><span>На коли</span><b>${dt(o.slotAt)}</b></div>
    <div class="dg"><span>Клієнт</span><b>${esc(o.nm)} · <a href="tel:${esc(o.tel)}">${esc(o.tel)}</a></b></div>
    <div class="dg"><span>Отримання</span><b>${o.mode==='delivery'?'🚕 доставка'+(o.addr?' · '+esc(o.addr):''):'🏪 самовивіз'}</b></div>
    <div class="dg"><span>Оплата</span><b>${o.pay==='card'?'картка на місці':'готівка'}</b></div>
    <div class="dg"><span>Вхід через Telegram</span><b>${o.auth===true?'так':o.auth===false?'ні':'—'}</b></div>
    ${o.note?`<div class="cm">💬 Коментар клієнта: ${esc(o.note)}</div>`:''}
    <div class="dh">Склад</div>
    ${(o.lines||[]).map(line).join('')}
    ${o.fg?`<div class="dl"><span>Смаження · ${kg(o.fg)}</span><span></span></div>`:''}
    ${o.ship?`<div class="dl"><span>Доставка</span><span>${money2(o.ship)}</span></div>`:''}
    <div class="dl tot"><span>Разом${o.totalOrig!=null&&o.totalOrig!==o.total?` <small>(на сайті ${money2(o.totalOrig)})</small>`:''}</span><span>${money2(o.total)}</span></div>
    ${(o.adj||[]).length?`<div class="dh">Зміни оператора</div>`+o.adj.map(a=>`<div class="ad">${ADJ[a.kind]||'•'} ${a.amount&&a.kind!=='note'&&a.kind!=='cancel'?'<b>'+money2(a.amount)+'</b> ':''}${esc(a.note||'')}
      <small>${dt(a.at)}${a.by?' · '+esc(a.by):''}</small></div>`).join(''):''}
  </div>`;
}
function renderOrders(s){
  const q=OQ.trim().toLowerCase();
  const all=s.orders||[];
  const list=q?all.filter(o=>[o.no,o.nm,o.tel,o.note,...(o.adj||[]).map(a=>a.note),...(o.lines||[]).map(l=>l.name)].join(' ').toLowerCase().includes(q)):all;
  const dayOf=o=>dayOfMs(s.by==='slot'?(o.slotAt||o.at):o.at);
  const groups={};
  for(const o of list){ (groups[dayOf(o)]=groups[dayOf(o)]||[]).push(o) }
  const tests=all.filter(isTest).length;
  const box=$('olist'); if(!box) return;
  box.innerHTML=(list.length?Object.keys(groups).sort().map(d=>{
      const g=groups[d], live=g.filter(o=>o.status!=='canceled');
      return `<div class="dayg"><div class="dgh"><b>${WD[wdOf(d)]}, ${dm(d)}</b><span>${live.length} зам. · ${money(live.reduce((x,o)=>x+o.total,0))}</span></div>
      ${g.map(o=>`<div class="orow${o.status==='canceled'?' off':''}${OPEN.has(o.no)?' open':''}" data-ono="${o.no}">
        <div class="oh"><b>№ ${o.no}</b><span class="t">${hm(o.at)}${o.slotAt?' → '+(dayOfMs(o.slotAt)!==dayOfMs(o.at)?dm(dayOfMs(o.slotAt))+' ':'')+hm(o.slotAt):''}</span>
          ${isTest(o)?'<span class="tb">ТЕСТ</span>':''}
          <span class="r">${money2(o.total)}</span></div>
        <div class="os">${esc(o.nm)} · ${o.mode==='delivery'?'🚕':'🏪'}${o.fg?' · 🔥 '+kg(o.fg):''} · ${esc(o.label)}${o.note?' · 💬':''}</div>
        ${OPEN.has(o.no)?orderDetail(o):''}
      </div>`).join('')}</div>`}).join('')
    :`<p class="empty">${q?'Нічого не знайшли.':'Замовлень немає.'}</p>`)
    +(s.ordersMore?`<p class="note">Показано 500 найсвіжіших, ще ${s.ordersMore} — оберіть коротший період.</p>`:'');
  $('osum').textContent=`${all.length} замовлень${tests?` · тестових ${tests}`:''}${q?` · знайдено ${list.length}`:''}`;
}
function renderOrdersView(s){
  $('out').innerHTML=`<div class="osearch"><input id="oq" type="search" placeholder="Пошук: номер, імʼя, телефон, «тест»…" autocomplete="off">
    <div class="note" id="osum" style="margin-top:6px"></div></div><div id="olist"></div>`;
  const i=$('oq'); i.value=OQ; i.oninput=()=>{ OQ=i.value; renderOrders(s) };
  renderOrders(s);
}
document.addEventListener('click',e=>{
  const r=e.target.closest&&e.target.closest('[data-ono]');
  if(!r||e.target.closest('a')||e.target.closest('.od')) return;
  const no=+r.dataset.ono; OPEN.has(no)?OPEN.delete(no):OPEN.add(no);
  if(LAST) renderOrders(LAST);
});

/* Підказка на дотик і наведення: одна на всю сторінку */
const tip=$('tip');
function showTip(e){
  const r=e.target.closest&&e.target.closest('[data-tip]');
  if(!r){ tip.style.opacity=0; return }
  tip.textContent=r.dataset.tip;
  const x=Math.min(window.innerWidth-tip.offsetWidth-8,Math.max(8,e.clientX-tip.offsetWidth/2));
  tip.style.left=x+'px'; tip.style.top=Math.max(8,e.clientY-44)+'px'; tip.style.opacity=1;
}
document.addEventListener('pointermove',showTip);
document.addEventListener('pointerdown',showTip);

function ask(msg){
  $('out').innerHTML=`<div class="err">${msg?esc(msg)+'<br><br>':''}Напишіть боту в особисті <code>/stats</code> — він дасть посилання. Відкрийте його тут один раз, далі сторінка відкриватиметься сама.</div>`;
}
async function load(){
  if(!token) return ask();
  paintPer();
  try{
    const q=(SEL.from?`from=${SEL.from}&to=${SEL.to}`:'days='+SEL.days)+'&by='+BY;
    const r=await fetch(API+'/api/stats?'+q,{headers:{Authorization:'Bearer '+token}});
    const d=await r.json().catch(()=>({}));
    if(r.status===401){ token=null; try{localStorage.removeItem(KEY)}catch(e){} return ask('Доступ відкликано або він застарів.') }
    if(!r.ok||!d.ok) throw new Error(d.error||'');
    render(d);
  }catch(e){ $('out').innerHTML='<p class="empty">Немає звʼязку з сервером. Спробуйте пізніше.</p>' }
}
const hm=ms=>new Date(ms).toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Kyiv'});
const dayOfMs=ms=>new Date(ms).toLocaleDateString('sv-SE',{timeZone:'Europe/Kyiv'});
const TODAY=()=>(LAST&&LAST.today)||dayOfMs(Date.now());
/* Останній день, який можна обрати: за днем видачі — два місяці наперед */
const maxDay=()=>BY==='slot'?dAdd(TODAY(),60):TODAY();
$('by').onclick=e=>{ const b=e.target.closest('[data-by]'); if(!b||b.dataset.by===BY) return;
  BY=b.dataset.by; try{localStorage.setItem('mb-stats-by',BY)}catch(x){}
  /* обраний день у майбутньому, а тепер рахуємо за днем замовлення — повертаємось на сьогодні */
  if(BY==='created'&&SEL.from&&SEL.to>TODAY()) SEL={from:TODAY(),to:TODAY()};
  go(SEL) };
$('views').onclick=e=>{ const b=e.target.closest('[data-v]'); if(!b||b.dataset.v===VIEW) return;
  VIEW=b.dataset.v; try{localStorage.setItem('mb-stats-view',VIEW)}catch(x){}
  paintPer(); if(LAST) render(LAST) };
function go(sel){ SEL=sel; $('out').innerHTML='<p class="empty">Завантажую…</p>'; window.scrollTo(0,0); load() }
const oneDay=d=>go({from:d,to:d});

/* Підсвічуємо кнопку, що відповідає поточному вибору */
function paintPer(){
  const t=TODAY(), one=SEL.from&&SEL.from===SEL.to;
  $('per').querySelectorAll('button').forEach(b=>{
    const on= b.dataset.d ? (!SEL.from&&+b.dataset.d===SEL.days)
      : b.dataset.p==='today' ? (one&&SEL.from===t)
      : b.dataset.p==='yday' ? (one&&SEL.from===dAdd(t,-1))
      : b.dataset.p==='tmrw' ? (one&&SEL.from===dAdd(t,1))
      : b.dataset.p==='pick' ? (!!PICK||(!!SEL.from&&!(one&&(SEL.from===t||SEL.from===dAdd(t,-1)||SEL.from===dAdd(t,1)))))
      : false;
    b.classList.toggle('on',!!on);             // !! — інакше undefined перемикав би клас туди-сюди
  });
  const tm=$('per').querySelector('[data-p="tmrw"]'); if(tm) tm.hidden=BY!=='slot';
  $('by').querySelectorAll('[data-by]').forEach(b=>b.classList.toggle('on',b.dataset.by===BY));
  $('views').querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===VIEW));
}
/* Один день — стрілки на сусідні */
function paintDayHd(s){
  const el=$('dayhd');
  if(s.from!==s.to){ el.innerHTML=''; return }
  el.innerHTML=`<div class="dayhd"><button data-step="-1" aria-label="Попередній день">‹</button>
    <b>${WD[wdOf(s.from)]}, ${dm(s.from)}${s.from===s.today?' · сьогодні':''}</b>
    <button data-step="1" ${s.from>=maxDay()?'disabled':''} aria-label="Наступний день">›</button></div>`;
  el.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>oneDay(dAdd(s.from,+b.dataset.step)));
}
/* Календар: перший дотик — цей день, другий — період між ними */
function paintPick(){
  const el=$('pick');
  if(!PICK){ el.innerHTML=''; return }
  const t=TODAY(), first=(LAST&&LAST.first)||'2026-09-01', m=PICK.month;
  const [y,mo]=m.split('-').map(Number);
  const d1=m+'-01', lastD=dAdd(dAdd(m+'-01',32).slice(0,7)+'-01',-1);
  const lead=(wdOf(d1)+6)%7;
  let g=['Пн','Вт','Ср','Чт','Пт','Сб','Нд'].map(w=>`<div class="wd">${w}</div>`).join('');
  for(let i=0;i<lead;i++) g+='<div></div>';
  const a=SEL.from||'', b=SEL.to||'';
  for(let d=d1; d<=lastD; d=dAdd(d,1)){
    const cls=[a&&d>=a&&d<=b?'in':'', d===a||d===b?'end':'', d===t?'today':''].join(' ');
    g+=`<button class="d ${cls}" data-pd="${d}" ${d>maxDay()?'disabled':''}>${+d.slice(8)}</button>`;
  }
  const prevM=dAdd(d1,-1).slice(0,7), nextM=dAdd(lastD,1).slice(0,7);
  el.innerHTML=`<div class="pick"><div class="ph"><button data-pm="${prevM}">‹</button><b>${MON[mo-1]} ${y}</b>
    <button data-pm="${nextM}">›</button></div>
    <div class="g">${g}</div>
    <div class="hint">${PICK.anchor?'Торкніться ще одного дня — покажемо період між ними. Або лишіть один день.':'Торкніться дня — покажемо його. Потім ще одного — буде період.'}${first<t?' Замовлення з сайту є з '+dm(first)+'.':''}</div></div>`;
  el.querySelectorAll('[data-pm]').forEach(x=>x.onclick=()=>{ PICK.month=x.dataset.pm; paintPick() });
  el.querySelectorAll('[data-pd]').forEach(x=>x.onclick=()=>{
    const d=x.dataset.pd;
    if(PICK.anchor&&PICK.anchor!==d){
      const [f2,t2]=PICK.anchor<d?[PICK.anchor,d]:[d,PICK.anchor];
      PICK.anchor=''; go({from:f2,to:t2});
    }else{ PICK.anchor=d; go({from:d,to:d}) }
  });
}

$('per').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.p==='pick'){
    PICK=PICK?null:{month:(SEL.from||TODAY()).slice(0,7),anchor:''};
    paintPick(); paintPer(); return;
  }
  PICK=null; paintPick();
  if(b.dataset.d){ DAYS=+b.dataset.d; try{localStorage.setItem('mb-stats-days',DAYS)}catch(x){}; return go({days:DAYS}) }
  if(b.dataset.p==='today') return oneDay(TODAY());
  if(b.dataset.p==='yday') return oneDay(dAdd(TODAY(),-1));
  if(b.dataset.p==='tmrw') return oneDay(dAdd(TODAY(),1));
};
/* Стовпчик дня на графіку — відкрити цей день */
document.addEventListener('click',e=>{
  const r=e.target.closest&&e.target.closest('[data-day]');
  if(r) oneDay(r.dataset.day);
});

(async function(){
  const code=location.hash.replace(/^#/,'').trim();
  if(code&&!token){
    try{
      const r=await fetch(API+'/api/stats/claim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok||!d.token) return ask(d.error||'Не вдалося увійти');
      token=d.token; try{localStorage.setItem(KEY,token)}catch(e){}
    }catch(e){ return ask('Немає звʼязку з сервером.') }
    history.replaceState(null,'',location.pathname);
  }
  load();
})();
</script>
</body>
</html>
